[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discogs_player"
version = "0.1.0"
description = "CLI-first Discogs collection sync and playback helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13,<14",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "rapidfuzz>=3.9,<4.0",
]

[project.scripts]
dplayer = "discogs_player.main:main"
dplayer-gui = "discogs_player.ui_main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
