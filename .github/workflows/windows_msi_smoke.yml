name: Windows MSI Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  windows-msi-smoke:
    name: Windows MSI smoke install
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project (web extras for API)
        run: pip install -e ".[web]"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build sidecar binary
        shell: bash
        run: ./scripts/build_sidecar.sh --target-triple "x86_64-pc-windows-msvc"

      - name: Validate sidecar contract
        shell: bash
        run: |
          python3 scripts/validate_tauri_sidecar_contract.py \
            --target-triple "x86_64-pc-windows-msvc" \
            --require-file

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop_shell/src-tauri -> target"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows MSI bundle
        working-directory: desktop_shell/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles msi

      - name: Smoke-test MSI install
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./scripts/validate_tauri_windows_msi_smoke.ps1 `
            -TargetTriple "x86_64-pc-windows-msvc" `
            -TimeoutSeconds 600

      - name: Upload MSI smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-smoke-logs
          path: build/windows-msi-smoke/**
          if-no-files-found: ignore
