name: Installer Build

# Builds cross-platform GUI installers:
#   Windows   → .msi + .exe  (Tauri + PyInstaller sidecar)
#   macOS     → .dmg         (Tauri + PyInstaller sidecar)
#   Linux     → .deb + .AppImage (Tauri + PyInstaller sidecar)
#   Debian    → .deb         (GTK4 native, via fpm) — ubuntu runner only
#
# Triggers:
#   - Tag push  (v*) → produces artifacts and attaches to GitHub Release
#   - Manual dispatch for one-off installer testing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag / version label (e.g. v0.2.0). Use a stable v* tag to repair an existing release."
        required: false
        default: "dev"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Phase B: Build the PyInstaller API sidecar on each platform
  # ---------------------------------------------------------------------------
  build-sidecar:
    name: Sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_triple: x86_64-unknown-linux-gnu
          - os: macos-14
            target_triple: aarch64-apple-darwin
          - os: macos-15-intel
            target_triple: x86_64-apple-darwin
          - os: windows-2022
            target_triple: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (web extras for API)
        run: pip install -e ".[web]"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build sidecar binary
        shell: bash
        run: ./scripts/build_sidecar.sh --target-triple "${{ matrix.target_triple }}"

      - name: Validate sidecar contract
        shell: bash
        run: |
          args=(scripts/validate_tauri_sidecar_contract.py --target-triple "${{ matrix.target_triple }}" --require-file)
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            args+=(--check-executable)
          fi
          python3 "${args[@]}"

      - name: Smoke-test sidecar startup (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          binary="desktop_shell/src-tauri/binaries/dplayer-api-${{ matrix.target_triple }}"
          chmod +x "$binary"
          "$binary" &
          PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:8768/healthz; then break; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8768/healthz; then
            kill $PID || true
            echo "ERROR: sidecar did not respond on /healthz after 10 seconds." >&2
            exit 1
          fi
          kill $PID

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target_triple }}
          path: desktop_shell/src-tauri/binaries/dplayer-api-${{ matrix.target_triple }}*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase A + D: Build Tauri installers (requires sidecar from prior job)
  # ---------------------------------------------------------------------------
  build-tauri:
    name: Tauri Installer (${{ matrix.os }})
    needs: build-sidecar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_triple: x86_64-unknown-linux-gnu
            tauri_targets: deb,appimage
          - os: macos-14
            target_triple: aarch64-apple-darwin
            tauri_targets: dmg
          - os: macos-15-intel
            target_triple: x86_64-apple-darwin
            tauri_targets: dmg
          - os: windows-2022
            target_triple: x86_64-pc-windows-msvc
            tauri_targets: msi,nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log workflow ref and commit
        shell: bash
        run: |
          echo "github.sha=${{ github.sha }}"
          echo "github.ref=${{ github.ref }}"
          git rev-parse HEAD

      # -- Linux system deps for GTK (needed for Tauri WebKitGTK on Linux) --
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # -- Rust toolchain --
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop_shell/src-tauri -> target"

      # -- Node for the React webapp build --
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      # -- Download the pre-built sidecar for this platform --
      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target_triple }}
          path: desktop_shell/src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x desktop_shell/src-tauri/binaries/dplayer-api-${{ matrix.target_triple }}

      - name: Validate downloaded sidecar contract
        shell: bash
        run: |
          args=(scripts/validate_tauri_sidecar_contract.py --target-triple "${{ matrix.target_triple }}" --require-file)
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            args+=(--check-executable)
          fi
          python3 "${args[@]}"

      # -- macOS: import signing certificate into keychain before build --
      - name: Import Apple signing certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "ci-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci-keychain" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "ci-keychain" build.keychain
          rm -f certificate.p12

      # -- Tauri build --
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri installers
        working-directory: desktop_shell/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # macOS code signing (Apple Developer Program) — empty until certs are provisioned
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          # Windows code signing — empty until cert is provisioned
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: cargo tauri build --target ${{ matrix.target_triple }} --bundles ${{ matrix.tauri_targets }}

      - name: Validate Linux Tauri bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./scripts/validate_tauri_linux_bundle.sh \
            --target-triple "${{ matrix.target_triple }}"

      - name: Validate macOS Tauri bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash ./scripts/validate_tauri_macos_bundle.sh \
            --target-triple "${{ matrix.target_triple }}"

      - name: Validate Windows Tauri bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/validate_tauri_windows_bundle.ps1 `
            -TargetTriple "${{ matrix.target_triple }}"

      # -- Collect installer artifacts --
      - name: Upload Tauri installers (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-${{ matrix.target_triple }}
          path: |
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/deb/*.deb
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/deb/*.deb.sig
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/appimage/*.AppImage
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Upload Tauri installers (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.target_triple }}
          path: |
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/dmg/*.dmg
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/dmg/*.dmg.sig
          if-no-files-found: error

      - name: Upload Tauri installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-${{ matrix.target_triple }}
          path: |
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/msi/*.msi
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/msi/*.msi.sig
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/nsis/*.exe
            desktop_shell/src-tauri/target/${{ matrix.target_triple }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase C: MSIX package for Microsoft Store (Windows, x64)
  # ---------------------------------------------------------------------------
  build-msix:
    name: MSIX (Microsoft Store)
    needs: build-tauri
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $version = (Get-Content desktop_shell/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download Windows Tauri artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-windows-*
          merge-multiple: true
          path: dist/tauri-windows

      - name: Locate app binary from NSIS bundle
        shell: pwsh
        run: |
          # NSIS installer is a self-extracting archive; we extract it to get the .exe
          $exe = Get-ChildItem -Recurse dist/tauri-windows -Filter "*setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "No NSIS setup.exe found"; exit 1 }
          Write-Host "Found installer: $($exe.FullName)"

          # Use 7-Zip (available on windows-2022 runners) to extract the NSIS payload
          7z x "$($exe.FullName)" -odist/nsis-extracted -y | Out-Null

          # Find the main app executable in the extracted payload
          $appExe = Get-ChildItem -Recurse dist/nsis-extracted -Filter "Discogs Spinner.exe" | Select-Object -First 1
          if (-not $appExe) { Write-Error "Could not find 'Discogs Spinner.exe' in NSIS payload"; exit 1 }
          Write-Host "App binary: $($appExe.FullName)"
          echo "APP_EXE_PATH=$($appExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "APP_EXE_DIR=$($appExe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage MSIX package directory
        shell: pwsh
        run: |
          $pkgDir = "dist/msix-stage"
          New-Item -ItemType Directory -Force $pkgDir | Out-Null

          # Copy all app files from the extracted NSIS payload
          Copy-Item -Recurse "$env:APP_EXE_DIR\*" "$pkgDir\" -Force

          # Update manifest version to match app version (x.y.z.0 format)
          $manifest = Get-Content packaging/msix/Package.appxmanifest -Raw
          $manifest = $manifest -replace 'Version="[^"]*"', "Version=`"$env:APP_VERSION.0`""
          $manifest | Set-Content "$pkgDir\AppxManifest.xml"

          # Copy tile assets
          New-Item -ItemType Directory -Force "$pkgDir\assets" | Out-Null
          Copy-Item packaging/msix/assets\* "$pkgDir\assets\" -Force

          Write-Host "MSIX stage contents:"
          Get-ChildItem -Recurse $pkgDir | Select-Object FullName

      - name: Build MSIX with makeappx
        shell: pwsh
        run: |
          # Locate makeappx.exe from the Windows SDK (available on windows-2022)
          $sdk = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem -Recurse $sdk -Filter "makeappx.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object -Descending |
            Select-Object -First 1
          if (-not $makeappx) { Write-Error "makeappx.exe not found in Windows SDK"; exit 1 }
          Write-Host "Using $($makeappx.FullName)"

          $outFile = "dist/Discogs.Spinner_$env:APP_VERSION_x64.msix"
          & "$($makeappx.FullName)" pack /d dist/msix-stage /p $outFile /nv
          Write-Host "Built: $outFile"
          echo "MSIX_PATH=$outFile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-msix-windows
          path: dist/Discogs.Spinner_*_x64.msix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase D: GTK4 .deb via fpm (Debian/Ubuntu native, no Tauri)
  # ---------------------------------------------------------------------------
  build-gtk4-deb:
    name: GTK4 .deb (fpm)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruby + fpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby ruby-dev build-essential lintian
          sudo gem install fpm --no-document

      - name: Validate Linux desktop metadata
        run: python3 scripts/validate_linux_packaging_metadata.py

      - name: Build GTK4 .deb
        run: ./scripts/build_deb.sh

      - name: Run GTK4 .deb lintian QA
        run: |
          DEB_FILE="$(ls -t dist/installers/*.deb | head -1)"
          lintian_output="$(lintian --allow-root "$DEB_FILE" || true)"
          printf '%s\n' "$lintian_output"
          allowed_lintian_errors='dir-or-file-in-opt|extended-description-is-empty'
          unexpected_errors="$(grep -E '^E:' <<<"$lintian_output" | grep -Ev "$allowed_lintian_errors" || true)"
          if [[ -n "$unexpected_errors" ]]; then
            echo "$unexpected_errors" >&2
            echo "ERROR: lintian reported unexpected error-level GTK .deb issues." >&2
            exit 1
          fi

      - name: Upload GTK4 .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-gtk4-deb
          path: dist/installers/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Validate GTK4 .deb via Docker clean install
  # ---------------------------------------------------------------------------
  validate-deb:
    name: Validate GTK4 .deb (Docker clean install)
    needs: build-gtk4-deb
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GTK4 .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-gtk4-deb
          path: dist/installers/

      - name: Run Docker clean-install test
        run: |
          DEB_FILE="$(ls -t dist/installers/*.deb | head -1)"
          DEB_REL="${DEB_FILE#"${GITHUB_WORKSPACE}/"}"
          docker build \
            --build-arg "DEB_PATH=${DEB_REL}" \
            -f packaging/test/Dockerfile.debian-clean \
            -t dplayer-debian-clean-test:ci \
            .
          echo "PASS: Debian clean install succeeded."

  # ---------------------------------------------------------------------------
  # Publish to GitHub Release (tag pushes only)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v'))
    needs:
      - build-tauri
      - build-msix
      - build-gtk4-deb
      - validate-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ github.event.inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$release_tag" ]]; then
            echo "ERROR: release tag is empty." >&2
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^v[0-9] ]]; then
            echo "ERROR: release tag must start with v for publish-release. Got: $release_tag" >&2
            exit 1
          fi

          release_version="${release_tag#v}"
          release_notes="docs/releases/${release_tag}.md"
          raw_dir="dist/release/raw"
          publish_dir="dist/release/publish"

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$release_notes" >> "$GITHUB_ENV"
          echo "RELEASE_RAW_DIR=$raw_dir" >> "$GITHUB_ENV"
          echo "RELEASE_PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"

          echo "INFO: release_tag=$release_tag"
          echo "INFO: release_version=$release_version"
          echo "INFO: release_notes=$release_notes"

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: false
          path: dist/release/raw

      - name: Stage publish assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RELEASE_PUBLISH_DIR"

          copy_single_asset() {
            local source_path="$1"
            local target_name="$2"
            cp "$source_path" "$RELEASE_PUBLISH_DIR/$target_name"
            echo "INFO: staged $source_path -> $RELEASE_PUBLISH_DIR/$target_name"
          }

          copy_asset_group() {
            local target_name="$1"
            shift
            local matches=("$@")
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "ERROR: expected exactly one match for $target_name, found ${#matches[@]}." >&2
              printf '  %s\n' "${matches[@]}" >&2 || true
              exit 1
            fi
            copy_single_asset "${matches[0]}" "$target_name"
          }

          mapfile -d '' -t gtk_debs < <(find "$RELEASE_RAW_DIR"/installer-gtk4-deb -type f -name '*.deb' -print0 | sort -z)
          mapfile -d '' -t linux_debs < <(find "$RELEASE_RAW_DIR"/installer-linux-* -type f -name '*.deb' -print0 | sort -z)
          mapfile -d '' -t appimages < <(find "$RELEASE_RAW_DIR"/installer-linux-* -type f -name '*.AppImage' -print0 | sort -z)
          mapfile -d '' -t dmgs < <(find "$RELEASE_RAW_DIR"/installer-macos-* -type f -name '*.dmg' -print0 | sort -z)
          mapfile -d '' -t msis < <(find "$RELEASE_RAW_DIR"/installer-windows-* -type f -name '*.msi' -print0 | sort -z)
          mapfile -d '' -t exes < <(find "$RELEASE_RAW_DIR"/installer-windows-* -type f -name '*.exe' -print0 | sort -z)
          mapfile -d '' -t msix_files < <(find "$RELEASE_RAW_DIR"/installer-msix-* -type f -name '*.msix' -print0 2>/dev/null | sort -z || true)

          copy_asset_group "discogs-spinner-gtk4_${RELEASE_VERSION}_amd64.deb" "${gtk_debs[@]}"
          copy_asset_group "discogs-spinner-tauri_${RELEASE_VERSION}_amd64.deb" "${linux_debs[@]}"

          for appimage in "${appimages[@]}"; do
            copy_single_asset "$appimage" "$(basename "$appimage")"
          done
          for dmg in "${dmgs[@]}"; do
            copy_single_asset "$dmg" "$(basename "$dmg")"
          done
          for msi in "${msis[@]}"; do
            copy_single_asset "$msi" "$(basename "$msi")"
          done
          for exe in "${exes[@]}"; do
            copy_single_asset "$exe" "$(basename "$exe")"
          done
          for msix in "${msix_files[@]}"; do
            copy_single_asset "$msix" "$(basename "$msix")"
          done

      - name: Generate Tauri updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail

          # Only generate if signing was active (sig files present).
          sig_count=$(find "$RELEASE_RAW_DIR" -name '*.sig' | wc -l)
          if [[ "$sig_count" -eq 0 ]]; then
            echo "INFO: No .sig files found — skipping latest.json generation (updater key not configured)."
            exit 0
          fi

          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base_url="https://github.com/edonahue/Discogs_Spinner/releases/download/${RELEASE_TAG}"

          read_sig() {
            local f="$1"
            if [[ -f "$f" ]]; then
              cat "$f"
            else
              echo ""
            fi
          }

          # Locate signed artifacts
          appimage_file="$(find "$RELEASE_RAW_DIR" -name '*.AppImage' ! -name '*.sig' | sort | head -1 || true)"
          appimage_sig="$(find "$RELEASE_RAW_DIR" -name '*.AppImage.sig' | sort | head -1 || true)"
          dmg_arm_file="$(find "$RELEASE_RAW_DIR" -name '*aarch64.dmg' ! -name '*.sig' | sort | head -1 || true)"
          dmg_arm_sig="$(find "$RELEASE_RAW_DIR" -name '*aarch64.dmg.sig' | sort | head -1 || true)"
          dmg_x64_file="$(find "$RELEASE_RAW_DIR" -name '*x64.dmg' ! -name '*.sig' | sort | head -1 || true)"
          dmg_x64_sig="$(find "$RELEASE_RAW_DIR" -name '*x64.dmg.sig' | sort | head -1 || true)"
          nsis_file="$(find "$RELEASE_RAW_DIR" -name '*setup.exe' ! -name '*.sig' | sort | head -1 || true)"
          nsis_sig="$(find "$RELEASE_RAW_DIR" -name '*setup.exe.sig' | sort | head -1 || true)"

          build_platform_entry() {
            local url="$1" sig_file="$2"
            if [[ -z "$sig_file" || ! -f "$sig_file" ]]; then return; fi
            local sig; sig="$(cat "$sig_file")"
            printf '{"url":"%s","signature":"%s"}' "$url" "$sig"
          }

          platforms="{}"

          if [[ -n "$appimage_file" && -n "$appimage_sig" ]]; then
            fname="$(basename "$appimage_file")"
            entry="$(build_platform_entry "${base_url}/${fname}" "$appimage_sig")"
            platforms="$(printf '%s' "$platforms" | python3 -c "import json,sys; d=json.load(sys.stdin); d['linux-x86_64']=${entry}; print(json.dumps(d))")"
          fi
          if [[ -n "$dmg_arm_file" && -n "$dmg_arm_sig" ]]; then
            fname="$(basename "$dmg_arm_file")"
            entry="$(build_platform_entry "${base_url}/${fname}" "$dmg_arm_sig")"
            platforms="$(printf '%s' "$platforms" | python3 -c "import json,sys; d=json.load(sys.stdin); d['darwin-aarch64']=${entry}; print(json.dumps(d))")"
          fi
          if [[ -n "$dmg_x64_file" && -n "$dmg_x64_sig" ]]; then
            fname="$(basename "$dmg_x64_file")"
            entry="$(build_platform_entry "${base_url}/${fname}" "$dmg_x64_sig")"
            platforms="$(printf '%s' "$platforms" | python3 -c "import json,sys; d=json.load(sys.stdin); d['darwin-x86_64']=${entry}; print(json.dumps(d))")"
          fi
          if [[ -n "$nsis_file" && -n "$nsis_sig" ]]; then
            fname="$(basename "$nsis_file")"
            entry="$(build_platform_entry "${base_url}/${fname}" "$nsis_sig")"
            platforms="$(printf '%s' "$platforms" | python3 -c "import json,sys; d=json.load(sys.stdin); d['windows-x86_64']=${entry}; print(json.dumps(d))")"
          fi

          python3 - <<PYEOF
          import json
          platforms = json.loads('''$platforms''')
          manifest = {
              "version": "${RELEASE_TAG}",
              "notes": "See https://github.com/edonahue/Discogs_Spinner/releases/tag/${RELEASE_TAG}",
              "pub_date": "${pub_date}",
              "platforms": platforms,
          }
          with open("$RELEASE_PUBLISH_DIR/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("INFO: latest.json written with platforms:", list(platforms.keys()))
          PYEOF

      - name: Validate release asset inventory
        shell: bash
        run: |
          echo "Published asset candidates:"
          ls -1 "$RELEASE_PUBLISH_DIR" | sort
          test -f "$RELEASE_PUBLISH_DIR/discogs-spinner-gtk4_${RELEASE_VERSION}_amd64.deb"
          test -f "$RELEASE_PUBLISH_DIR/discogs-spinner-tauri_${RELEASE_VERSION}_amd64.deb"
          ls "$RELEASE_PUBLISH_DIR"/*.dmg >/dev/null
          ls "$RELEASE_PUBLISH_DIR"/*.msi >/dev/null
          ls "$RELEASE_PUBLISH_DIR"/*.exe >/dev/null
          ls "$RELEASE_PUBLISH_DIR"/*.AppImage >/dev/null
          ls "$RELEASE_PUBLISH_DIR"/*.msix >/dev/null

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd "$RELEASE_PUBLISH_DIR"
          sha256sum * > CHECKSUMS-INSTALLERS.txt
          cat CHECKSUMS-INSTALLERS.txt

      - name: Generate installer manifest
        shell: bash
        run: |
          cd "$RELEASE_PUBLISH_DIR"
          {
            echo "# Discogs Spinner ${RELEASE_TAG} Installer Manifest"
            echo ""
            echo "Generated by Installer Build for ${GITHUB_SHA}."
            echo ""
            echo "| Asset | Bytes |"
            echo "|---|---:|"
            for asset in *; do
              if [[ "$asset" == "INSTALLER-MANIFEST.txt" ]]; then
                continue
              fi
              bytes="$(wc -c < "$asset")"
              echo "| ${asset} | ${bytes} |"
            done
          } > INSTALLER-MANIFEST.txt
          cat INSTALLER-MANIFEST.txt

      - name: Validate release notes file
        shell: bash
        run: |
          test -f "$RELEASE_NOTES_PATH"

      - name: Create or update GitHub Release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Discogs Spinner $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$RELEASE_TAG" \
              --title "Discogs Spinner $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi

      - name: Upload installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          publish_files=("$RELEASE_PUBLISH_DIR"/*)
          if [[ ${#publish_files[@]} -eq 0 ]]; then
            echo "ERROR: no staged publish files found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${publish_files[@]}" --clobber

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          echo "Published release assets:"
          printf '%s\n' "$asset_names"

          grep -Fx "discogs-spinner-gtk4_${RELEASE_VERSION}_amd64.deb" <<<"$asset_names"
          grep -Fx "discogs-spinner-tauri_${RELEASE_VERSION}_amd64.deb" <<<"$asset_names"
          grep -F ".AppImage" <<<"$asset_names"
          grep -F ".dmg" <<<"$asset_names"
          grep -F ".msi" <<<"$asset_names"
          grep -F ".exe" <<<"$asset_names"
          grep -F ".msix" <<<"$asset_names"
          grep -Fx "CHECKSUMS-INSTALLERS.txt" <<<"$asset_names"
          grep -Fx "INSTALLER-MANIFEST.txt" <<<"$asset_names"
