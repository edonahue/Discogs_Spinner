name: spinner-for-discogs
title: Spinner for Discogs
base: core24
version: "0.2.3"
summary: Pick, browse, and value your Discogs vinyl collection
description: |
  Spinner for Discogs is a local-first desktop companion for vinyl collectors
  who keep their shelves in Discogs.

  Connect your Discogs account with a personal access token, sync your
  collection, then browse your records, spin a random album, inspect release
  details, track market value, and keep wantlist context close without living
  in browser tabs.

  What you can do:

  - Browse and search your Discogs collection and wantlist
  - Spin a random record when you cannot decide what to play
  - View cover art, release details, tracklists, and market prices
  - Check collection value and wantlist context from one desktop app
  - Optionally hand playback to Spotify or YouTube Music

  First run is designed to be quick: install the app, paste your Discogs
  personal access token into the setup wizard, sync once, and start browsing
  your records.

  Notes:

  - A free Discogs account and personal access token are required.
  - Spotify and YouTube Music are optional integrations.
  - Spinner for Discogs does not stream audio itself; it controls or opens
    external playback services when configured.
  - This is an unofficial third-party app and is not affiliated with Discogs.

license: MIT
website: https://github.com/edonahue/Discogs_Spinner
contact: https://github.com/edonahue/Discogs_Spinner/issues
source-code: https://github.com/edonahue/Discogs_Spinner
issues: https://github.com/edonahue/Discogs_Spinner/issues
icon: desktop_shell/icons/icon.png
grade: stable
confinement: strict

# Snap publication steps:
#   snapcraft login
#   snapcraft build
#   snapcraft upload spinner-for-discogs_0.2.3_amd64.snap --release=stable

layout:
  /usr/lib/x86_64-linux-gnu/girepository-1.0:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0
  /usr/share/glib-2.0/schemas:
    bind: $SNAP/usr/share/glib-2.0/schemas

parts:
  discogs-spinner:
    plugin: python
    source: .
    python-packages:
      - ".[web,spotify]"
    build-packages:
      # Provides glib-compile-schemas for the schema precompile step below.
      - libglib2.0-bin
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - libadwaita-1-0
      - gir1.2-gdkpixbuf-2.0
      - libgtk-4-1
      - libglib2.0-0
      - adwaita-icon-theme
    override-prime: |
      craftctl default
      # Precompile the staged GSettings schemas so GLib finds a ready
      # gschemas.compiled at launch instead of emitting repeated schema
      # symlink/compile warnings on first run. Best-effort: never fail the
      # build if the schema directory is absent (e.g. provided by the gnome
      # extension's platform snap).
      schema_dir="$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      if [ -d "$schema_dir" ]; then
        glib-compile-schemas "$schema_dir" || true
      fi

  desktop-assets:
    plugin: dump
    source: .
    organize:
      packaging/deb/dplayer-gui.desktop: usr/share/applications/discogs-spinner.desktop
      assets/icons/discogs-player.svg: usr/share/icons/hicolor/scalable/apps/discogs-spinner.svg
      packaging/metainfo/com.discogs-spinner.app.metainfo.xml: usr/share/metainfo/com.discogs-spinner.app.metainfo.xml
    stage:
      - usr/share/applications/discogs-spinner.desktop
      - usr/share/icons/hicolor/scalable/apps/discogs-spinner.svg
      - usr/share/metainfo/com.discogs-spinner.app.metainfo.xml
    override-build: |
      craftctl default
      sed -i 's|^Exec=.*|Exec=spinner-for-discogs|' \
        "${CRAFT_PART_INSTALL}/packaging/deb/dplayer-gui.desktop"

apps:
  spinner-for-discogs:
    command: bin/dplayer-gui
    desktop: usr/share/applications/discogs-spinner.desktop
    extensions: [gnome]
    plugs:
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - home
      - opengl
      - unity7
      - password-manager-service
    environment:
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0:$SNAP/usr/lib/aarch64-linux-gnu/girepository-1.0
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages
